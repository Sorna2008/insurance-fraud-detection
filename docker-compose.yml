version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: insureguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fraud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend & ML Prediction Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insureguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_2026}@db:5432/${POSTGRES_DB:-fraud_db}
      - SECRET_KEY=${SECRET_KEY:-insureguard-ai-production-secret-key-2026}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/uploads:/app/backend/app/uploads
      - ./models:/app/models

  # React Frontend (Development / Production Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insureguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
